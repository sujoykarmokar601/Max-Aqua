<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX AQUA Admin Orders</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><div class="wrap topbar-in"><b>MAX AQUA ADMIN</b><a href="index.html" style="color:#fff;text-decoration:none">← Website</a></div></div><main class="wrap" style="padding:30px 0"><div class="info" style="margin:0 0 20px"><div><span>ORDER PANEL</span><h2>সব Saved Orders</h2><p>এই browser-এ save হওয়া orders এখানে দেখা যাবে।</p></div><div class="info-cards"><div>📦<b id="count">0</b><small>Orders</small></div><div>💰<b id="sales">৳0</b><small>Total Sales</small></div><div>🛵<b>৳150</b><small>Delivery</small></div></div></div><div style="display:flex;gap:8px;margin-bottom:15px"><input id="search" style="flex:1;padding:12px;border:1px solid #ddd" placeholder="নাম / ফোন / Order ID খুঁজুন"><button onclick="render()" style="padding:12px 18px;border:0;background:#f57224;color:#fff">Refresh</button><button onclick="clearAll()" style="padding:12px 18px;border:0;background:#fff0ed;color:#d44">Delete All</button></div><div id="orders"></div></main><script>const money=n=>"৳"+Number(n||0).toLocaleString("en-BD");function data(){return JSON.parse(localStorage.getItem("maxAquaOrders")||"[]")}function render(){let all=data(),q=document.getElementById("search").value.toLowerCase(),os=all.filter(o=>(o.id+" "+o.name+" "+o.phone).toLowerCase().includes(q));document.getElementById("count").textContent=all.length;document.getElementById("sales").textContent=money(all.reduce((s,o)=>s+Number(o.total||0),0));document.getElementById("orders").innerHTML=os.map(o=>`<div style="background:#fff;margin:10px 0;padding:18px;border:1px solid #eee"><b>${o.id}</b> · ${o.date}<hr><b>নাম:</b> ${o.name}<br><b>ফোন:</b> ${o.phone}<br><b>ঠিকানা:</b> ${o.address}<p>${(o.items||[]).map(i=>`Product ID ${i.id} × ${i.qty}`).join("<br>")}</p><b>Subtotal:</b> ${money(o.subtotal)} · <b>Delivery:</b> ${money(o.delivery)} · <b style="color:#f57224">Total: ${money(o.total)}</b><br><button onclick="del('${o.id}')" style="margin-top:10px;border:0;padding:8px 12px;background:#fff0ed;color:#c44">Delete</button></div>`).join("")||'<div class="empty">কোনো Order নেই</div>'}function del(id){if(confirm("Delete this order?")){localStorage.setItem("maxAquaOrders",JSON.stringify(data().filter(o=>o.id!==id)));render()}}function clearAll(){if(confirm("সব order delete করবেন?")){localStorage.removeItem("maxAquaOrders");render()}}document.getElementById("search").oninput=render;render();</script></body></html>
